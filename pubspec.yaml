name: kaskelasku
description: Offline-first encrypted class treasury manager for Indonesian class treasurers.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: "3.24.0"

dependencies:
  flutter:
    sdk: flutter
  hooks_riverpod: ^1.0.4
  flutter_hooks: ^0.18.6
  sqflite_sqlcipher: 2.2.1
  path_provider: ^2.1.0
  flutter_secure_storage: ^5.0.2
  local_auth: ^2.1.6
  crypto: ^3.0.3
  cryptography: ^2.7.0
  pdf: ^3.10.4
  csv: ^5.0.2
  intl: ^0.19.0
  share_plus: ^7.2.2
  file_picker: ^8.0.7
  # Flutter 3.24 / AGP 7.3 compatibility; newer lifecycle versions require API 35.
  flutter_plugin_android_lifecycle: 2.0.19

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  sqflite_common_ffi: ^2.2.5
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/data/schema.sql
    - assets/fonts/NotoSans-Regular.ttf
